name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: app.exe
          - os: macos-latest
            asset: app-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip nuitka openai anthropic PySide6 requests

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m nuitka --onefile --plugin-enable=pyside6 --windows-console-mode=disable --output-filename=app.exe app.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m nuitka --standalone --macos-create-app-bundle --plugin-enable=pyside6 app.py
          ditto -c -k --sequesterRsrc --keepParent app.app app-macos.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
